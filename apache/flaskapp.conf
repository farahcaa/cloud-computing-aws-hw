<VirtualHost *:80>
    ServerName localhost

    WSGIDaemonProcess flaskapp user=ubuntu group=ubuntu threads=5 home=/home/ubuntu/hw-2
    WSGIScriptAlias / /home/ubuntu/hw-2/flaskapp.wsgi

    <Directory /home/ubuntu/hw-2>
        WSGIProcessGroup flaskapp
        WSGIApplicationGroup %{GLOBAL}
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
